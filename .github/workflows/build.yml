name: Build zodys v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK from scratch
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"
          export ANDROID_HOME=$SDK
          export ANDROID_SDK_ROOT=$SDK
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SM"
          ls -la "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tail -25
          echo "--- NDK ---"
          ls "$SDK/ndk"

      - name: Build arm64-v8a
        run: |
          SDK=$HOME/android-sdk
          TC="$SDK/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          ls -la "$TC"
          cmake -S . -B b64 \
            -DCMAKE_TOOLCHAIN_FILE="$TC" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -20
          cmake --build b64 -j4 2>&1 | tail -40
          mkdir -p out/so/arm64-v8a
          find b64 -name "libzodys.so" -exec cp {} out/so/arm64-v8a/ \;
          ls -la out/so/arm64-v8a/

      - name: Build armeabi-v7a
        run: |
          SDK=$HOME/android-sdk
          TC="$SDK/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          cmake -S . -B b32 \
            -DCMAKE_TOOLCHAIN_FILE="$TC" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -20
          cmake --build b32 -j4 2>&1 | tail -40
          mkdir -p out/so/armeabi-v7a
          find b32 -name "libzodys.so" -exec cp {} out/so/armeabi-v7a/ \;
          ls -la out/so/armeabi-v7a/

      - name: Java to smali
        continue-on-error: true
        run: |
          SDK=$HOME/android-sdk
          mkdir -p cls out/smali
          javac -nowarn -classpath "$SDK/platforms/android-34/android.jar" -d cls Surface.java 2>&1 | head -30
          (cd cls && jar cf ../classes.jar .)
          "$SDK/build-tools/34.0.0/d8" --output . classes.jar 2>&1 | tail -5
          wget -q https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar -O baksmali.jar
          java -jar baksmali.jar d classes.dex -o out/smali 2>&1 | tail -10
          find out/smali -name "*.smali" | head

      - name: Pack
        run: |
          mkdir -p out/final
          cp -r out/so/* out/final/ 2>/dev/null || true
          if [ -d out/smali/com ]; then mkdir -p out/final/smali_com && cp -r out/smali/com out/final/smali_com/; fi
          echo "=== FINAL ==="
          find out/final -type f

      - uses: actions/upload-artifact@v4
        with:
          name: zodys-out
          path: out/final/**
          if-no-files-found: warn
