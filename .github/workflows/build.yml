name: Build zodys

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect so
        run: |
          mkdir -p out/so
          find build -name "libzodys.so" | while read f; do
            ABI=$(basename $(dirname "$f"))
            mkdir -p "out/so/$ABI"
            cp "$f" "out/so/$ABI/"
          done
          find out/so -type f
      - name: To smali
        run: |
          AAR=$(find build -name "*.aar" | head -1)
          mkdir -p out/aar && cd out/aar && unzip -o "../../$AAR" > /dev/null
          cd ..
          D8=$(find $ANDROID_HOME/build-tools -name d8 | head -1)
          $D8 --output . aar/classes.jar
          wget -q https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar -O baksmali.jar
          java -jar baksmali.jar d classes.dex -o smali_out
          mkdir -p out/final
          cp -r so/* out/final/ 2>/dev/null || true
          cp -r smali_out/com out/final/smali_com 2>/dev/null || true
          find out/final -type f
      - uses: actions/upload-artifact@v4
        with:
          name: zodys-out
          path: out/final/**
          if-no-files-found: warn
